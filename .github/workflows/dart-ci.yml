name: Dart checks

on:
  pull_request:
  push:
    branches: [main, 'test/**', 'qa/**']

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve dependencies (including Flutter example)
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Regression tests
        run: dart test --reporter expanded
      - name: Benchmark smoke run
        run: dart run benchmark/bidi_benchmark.dart
      - name: ASCII benchmark smoke run
        run: dart run benchmark/ascii_fast_path_benchmark.dart

      - name: Plain Hebrew benchmark smoke run
        run: dart run benchmark/plain_hebrew_benchmark.dart

      - name: Optimized ASCII routing benchmark
        run: dart run benchmark/ascii_separator_routing_benchmark.dart
      - name: Baseline benchmark on same runner
        run: |
          git fetch origin main --depth=1
          git worktree add --detach /tmp/bidi-ascii-baseline FETCH_HEAD
          mkdir -p /tmp/bidi-ascii-baseline/benchmark
          cp benchmark/ascii_separator_routing_benchmark.dart /tmp/bidi-ascii-baseline/benchmark/
          cd /tmp/bidi-ascii-baseline
          flutter pub get
          dart run benchmark/ascii_separator_routing_benchmark.dart

      - name: Optimized common-class benchmark
        run: dart run benchmark/fast_character_classes_benchmark.dart
      - name: Baseline on same runner
        run: |
          git fetch origin main --depth=1
          git worktree add --detach /tmp/bidi-class-baseline FETCH_HEAD
          mkdir -p /tmp/bidi-class-baseline/benchmark
          cp benchmark/fast_character_classes_benchmark.dart /tmp/bidi-class-baseline/benchmark/
          cd /tmp/bidi-class-baseline
          flutter pub get
          dart run benchmark/fast_character_classes_benchmark.dart

      - name: Optimized neutral-run benchmark
        run: dart run benchmark/neutral_runs_benchmark.dart
      - name: Baseline benchmark against main on same runner
        run: |
          git fetch origin main --depth=1
          git worktree add --detach /tmp/bidi-neutral-baseline FETCH_HEAD
          mkdir -p /tmp/bidi-neutral-baseline/benchmark
          cp benchmark/neutral_runs_benchmark.dart /tmp/bidi-neutral-baseline/benchmark/
          cd /tmp/bidi-neutral-baseline
          flutter pub get
          dart run benchmark/neutral_runs_benchmark.dart
